name: Build iOS (unsigned IPA)
on:
  workflow_dispatch:
jobs:
  ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Arrange app files
        run: |
          mkdir -p www/fonts www/icons
          mv *.ttf www/fonts/
          mv icon-*.png www/icons/
          mv index.html app.css core.js ui.js sw.js manifest.webmanifest www/
          ls -R www
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Capacitor
        run: npm install
      - name: Create iOS project
        run: |
          npx cap add ios
          npx cap sync ios
      - name: Build (no code signing)
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -sdk iphoneos \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr P1S-Accounting-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: P1S-Accounting-ios
          path: P1S-Accounting-unsigned.ipa
