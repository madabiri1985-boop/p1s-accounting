name: Build iOS (unsigned IPA)
on:
  workflow_dispatch:
jobs:
  ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Arrange app files
        run: |
          if [ ! -d www ]; then
            mkdir -p www/fonts www/icons
            mv *.ttf www/fonts/
            mv icon-*.png logo*.png www/icons/
            mv index.html *.css *.js manifest.webmanifest www/
          fi
          ls -R www
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Capacitor
        run: npm install
      - name: Create iOS project
        run: |
          npx cap add ios
          npx cap sync ios
      - name: App icon from the Voxara logo
        run: |
          mkdir -p assets
          cp www/icons/logo-1024.png assets/logo.png
          npx --yes @capacitor/assets@3 generate --ios --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#ffffff' --splashBackgroundColor '#ffffff' --splashBackgroundColorDark '#ffffff'
      - name: Build (no code signing)
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -sdk iphoneos \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr Voxara3d-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Voxara3d-ios
          path: Voxara3d-unsigned.ipa
